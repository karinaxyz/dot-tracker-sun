name: Render wallpaper test PNGs

on:
  push:
    branches:
      - wallpaper-shortcut-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallpaper-shortcut-test
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render iPhone PNGs
        run: |
          rsvg-convert -w 1206 -h 2622 wallpaper-day.svg -o wallpaper-day.png
          rsvg-convert -w 1206 -h 2622 wallpaper-night.svg -o wallpaper-night.png
      - name: Commit rendered PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallpaper-day.png wallpaper-night.png
          git diff --cached --quiet || git commit -m "Render test wallpaper PNGs"
          git push
